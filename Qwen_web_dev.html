## Базовый пример

    if n <= 1:
        return n
    return fib(n-1) + fib(n-2)

## Рекурсия vs итерация

\`\`\`python
# Рекурсия — элегантно, но может быть медленной
def sum_recursive(lst):
    if not lst:
        return 0
    return lst[0] + sum_recursive(lst[1:])

# Итерация — быстрее
def sum_iterative(lst):
    total = 0
    for x in lst:
        total += x
    return total
